$kind: http-request
name: Update Column
method: PUT
url: '{{baseUrl}}/api/Column/UpdateColumn/{{columnId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "In Progress"
    }
