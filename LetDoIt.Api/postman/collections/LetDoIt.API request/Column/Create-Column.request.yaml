$kind: http-request
name: Create Column
method: POST
url: '{{baseUrl}}/api/Column/CreateColumn'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "To Do",
      "position": 1,
      "projectId": "{{projectId}}"
    }
