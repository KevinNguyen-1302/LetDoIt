$kind: http-request
name: Move Task
method: PUT
url: '{{baseUrl}}/api/Task/MoveTask/{{taskId}}'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "newColumnId": "{{columnId}}"
    }
