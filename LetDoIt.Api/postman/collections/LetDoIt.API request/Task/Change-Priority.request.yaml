$kind: http-request
name: Change Priority
method: PUT
url: '{{baseUrl}}/api/Task/ChangePriority/{{taskId}}'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "priority": 3
    }
